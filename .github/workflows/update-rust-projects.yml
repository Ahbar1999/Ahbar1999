name: Update Rust Projects

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Fetch Rust repos and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os
          import re

          username = os.environ["GH_USERNAME"]
          token    = os.environ["GH_TOKEN"]

          # Fetch all repos, filter to Rust, sort by stars
          url = f"https://api.github.com/users/{username}/repos?per_page=100&sort=updated"
          req = urllib.request.Request(url, headers={
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(req) as r:
              repos = json.load(r)

          rust_repos = [
              r for r in repos
              if r.get("language") == "Rust" and not r.get("fork", False)
          ]
          rust_repos.sort(key=lambda r: r.get("stargazers_count", 0), reverse=True)

          if not rust_repos:
              rows = "| *(no public Rust repos yet)* | — | — |\n"
          else:
              rows = ""
              for repo in rust_repos[:10]:  # cap at 10 rows
                  name  = repo["name"]
                  url   = repo["html_url"]
                  desc  = repo.get("description") or "—"
                  stars = repo.get("stargazers_count", 0)
                  rows += f"| [**{name}**]({url}) | {desc} | ⭐ {stars} |\n"

          table = (
              "| repo | description | stars |\n"
              "|------|-------------|-------|\n"
              + rows
          )
          block = (
              "<!-- RUST-PROJECTS:START — auto-updated via GitHub Action -->\n"
              + table
              + "<!-- RUST-PROJECTS:END -->"
          )

          with open("README.md", "r") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- RUST-PROJECTS:START.*?<!-- RUST-PROJECTS:END -->",
              block,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(new_content)

          print(f"Updated README with {len(rust_repos)} Rust repo(s).")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes." || \
            (git add README.md && git commit -m "chore: update Rust projects [skip ci]" && git push)
